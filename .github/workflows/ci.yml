name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'refactor/**'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSE'
      - 'tools/build_wiki.py'
      - '.github/workflows/wiki-sync.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSE'
      - 'tools/build_wiki.py'
      - '.github/workflows/wiki-sync.yml'

jobs:
  build:
    if: ${{ !startsWith(github.head_ref, 'feature/ecc-') && !startsWith(github.ref_name, 'feature/ecc-') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_SHARED_LIBS=ON -DCRYPTO_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel 2
