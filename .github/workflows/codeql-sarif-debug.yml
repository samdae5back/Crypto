name: Temporary CodeQL SARIF Capture

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  analyze:
    name: Capture SARIF (c-cpp)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: none

      - name: Analyze without uploading
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
          output: sarif-output
          upload: false

      - name: Upload SARIF
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-c-cpp-${{ github.run_id }}
          path: sarif-output/*.sarif
          if-no-files-found: error
          retention-days: 1
