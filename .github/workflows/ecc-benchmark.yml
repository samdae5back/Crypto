name: ECC benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/ecc-*'

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLIBERAC_BUILD_TESTS=ON
      - name: Build focused ECC validation and benchmark
        run: cmake --build build --config Release --target liberacrypt_ecc_unit liberacrypt_ecc_differential liberacrypt_ecc_benchmark
      - name: Run focused ECC validation
        run: ctest --test-dir build -C Release -L ecc --output-on-failure
      - name: Run benchmark (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./build/liberacrypt_ecc_benchmark > "ecc-benchmark-${{ runner.os }}.csv"
      - name: Run benchmark (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build/Release/liberacrypt_ecc_benchmark.exe | Out-File -Encoding ascii "ecc-benchmark-${{ runner.os }}.csv"
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ecc-benchmark-${{ runner.os }}
          path: ecc-benchmark-${{ runner.os }}.csv
