name: ECC validation

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'refactor/**'
  pull_request:
    branches: [ main ]

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_SHARED_LIBS=OFF -DLIBERAC_BUILD_TESTS=ON
      - name: Build focused ECC tests
        run: cmake --build build --config Release --target liberacrypt_ecc_unit liberacrypt_ecc_differential crypto_ecdsa_unit crypto_ecdsa_kat
      - name: Run focused ECC tests
        run: ctest --test-dir build -C Release -L ecc --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    env:
      CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-sanitize -DBUILD_SHARED_LIBS=OFF -DLIBERAC_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build focused ECC tests
        run: cmake --build build-sanitize --target liberacrypt_ecc_unit liberacrypt_ecc_differential crypto_ecdsa_unit crypto_ecdsa_kat
      - name: Run focused ECC tests
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize -L ecc --output-on-failure
