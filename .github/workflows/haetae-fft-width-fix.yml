name: Apply HAETAE FFT width cleanup

on:
  push:
    branches:
      - fix/haetae-fft-widths-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/haetae-fft-widths-v2
          fetch-depth: 0

      - name: Apply patch
        run: python .github/haetae_fft_width_patch.py

      - name: Build and test HAETAE
        run: |
          cmake -S . -B build -DBUILD_SHARED_LIBS=ON -DCRYPTO_BUILD_TESTS=ON
          cmake --build build -j2
          ctest --test-dir build -L haetae --output-on-failure

      - name: Run HAETAE sanitizers
        run: |
          cmake -S . -B build-asan \
            -DBUILD_SHARED_LIBS=OFF \
            -DCRYPTO_BUILD_TESTS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-asan -j2
          ASAN_OPTIONS=detect_leaks=0 \
            ctest --test-dir build-asan \
              -R 'Crypto.DigitalSignature.HAETAE.Unit' \
              --output-on-failure

      - name: Commit source changes
        run: |
          rm .github/haetae_fft_width_patch.py
          rm .github/workflows/haetae-fft-width-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DigitalSignature/HAETAE .github
          git commit -m "fix(haetae): harden FFT fixed-point widths" \
            -m "Make the HAETAE key-rejection FFT width model explicit and portable. Store FFT components as int32_t under a documented B8 <= 859963392 proof; evaluate Q16 multiplication and butterfly intermediates in int64_t; return squared magnitudes as uint64_t; and keep singular-value sums, best-m sorting, and accumulation in uint64_t. Replace signed right-shift Q16 arithmetic with the shared portable floor-division helper and retain branchless uint64_t compare/swap under a compile-time below-2^63 bound. Static assertions tie the proof to ETA=1, d<=1, N=256, eight stages, and current maximum parameter dimensions. Preserve final rounding as (result + 32) >> 6."
          git push origin HEAD:fix/haetae-fft-widths-v2
