name: Apply HAETAE proven warning fixes

on:
  push:
    branches:
      - fix/haetae-proven-msvc-warnings

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/haetae-proven-msvc-warnings
          fetch-depth: 0
      - name: Apply range-proven warning fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_exact(text, old, new, expected=1):
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f"expected {expected} occurrence(s), found {count}: {old!r}")
              return text.replace(old, new)

          # rANS: shift is ceil(log2(freq)); the encoder contract has scale_bits <= 16,
          # so shift - 1 is representable by uint16_t.
          path = "src/DigitalSignature/HAETAE/haetae_rans_byte.h"
          text = read(path)
          text = replace_exact(
              text,
              "        s->rcp_shift = shift - 1;",
              "        s->rcp_shift = (uint16_t)(shift - 1u);")
          write(path, text)

          # Encoding tables: the generated negative decimal reciprocals are signed spellings
          # of fixed uint32_t bit patterns. Rewrite only RansEncSymbol initializer lines to
          # explicit UINT32_C hex values; all other table fields remain byte-for-byte numeric.
          path = "src/DigitalSignature/HAETAE/haetae_encoding.c"
          text = read(path)
          lines = text.splitlines(keepends=True)
          table_lines = 0
          reciprocal_rewrites = 0
          for index, line in enumerate(lines):
              if line.startswith("static const RansEncSymbol "):
                  table_lines += 1
                  def unsigned_literal(match):
                      nonlocal reciprocal_rewrites
                      value = int(match.group(1))
                      if value > 0x80000000:
                          raise RuntimeError("negative initializer outside int32_t range")
                      reciprocal_rewrites += 1
                      return f"UINT32_C(0x{((-value) & 0xffffffff):08X})"
                  lines[index] = re.sub(r"(?<![A-Za-z0-9_])-([0-9]+)", unsigned_literal, line)
          if table_lines != 6 or reciprocal_rewrites == 0:
              raise RuntimeError(f"unexpected rANS table shape: lines={table_lines}, rewrites={reciprocal_rewrites}")
          text = "".join(lines)
          marker = "#define RANS_RCP_FREQ_HALF UINT32_C(0x80000000)\n"
          assertions = (
              marker
              + "\n_Static_assert(CRYPTO_HAETAE_MAX_HINT_COEFFICIENTS <= UINT16_MAX,\n"
              + "               \"encoded hint length must fit uint16_t\");\n"
              + "_Static_assert(CRYPTO_HAETAE_MAX_Z1_COEFFICIENTS <= UINT16_MAX,\n"
              + "               \"encoded z1 length must fit uint16_t\");\n"
          )
          text = replace_exact(text, marker, assertions)
          text = replace_exact(text, "    return size_encoded;", "    return (uint16_t)size_encoded;", expected=2)

          def widen_decode_symbol(text, function_name):
              start = text.index(f"uint16_t {function_name}(")
              next_banner = text.find("/*************************************************", start)
              end = len(text) if next_banner == -1 else next_banner
              block = text[start:end]
              block = replace_exact(block, "    uint8_t  s;", "    uint16_t s;")
              return text[:start] + block + text[end:]

          text = widen_decode_symbol(text, "crypto_haetae_decode_h")
          text = widen_decode_symbol(text, "crypto_haetae_decode_hb_z1")
          write(path, text)

          # Signature decoding: future parameter tables must still prove these encoded
          # lengths fit the uint16_t decoder interface before narrowing.
          path = "src/DigitalSignature/HAETAE/haetae_packing.c"
          text = read(path)
          old = (
              "    size_enc_hb_z1 = (uint16_t)sig[0] + parameters->base_encoding_high_bits_z1;\n"
              "    size_enc_h = (uint16_t)sig[1] + parameters->base_encoding_hint;\n"
          )
          new = (
              "    {\n"
              "        const uint32_t encoded_hb_z1_size =\n"
              "            (uint32_t)sig[0] + parameters->base_encoding_high_bits_z1;\n"
              "        const uint32_t encoded_h_size =\n"
              "            (uint32_t)sig[1] + parameters->base_encoding_hint;\n"
              "\n"
              "        if (encoded_hb_z1_size > UINT16_MAX || encoded_h_size > UINT16_MAX)\n"
              "            return 1;\n"
              "        size_enc_hb_z1 = (uint16_t)encoded_hb_z1_size;\n"
              "        size_enc_h = (uint16_t)encoded_h_size;\n"
              "    }\n"
          )
          text = replace_exact(text, old, new)
          write(path, text)

          # ETA packing functions document bounded coefficient domains. Make those
          # contract-backed byte conversions explicit, but deliberately leave
          # crypto_haetae_poly_decomposed_pack untouched for separate invariant review.
          path = "src/DigitalSignature/HAETAE/haetae_poly.c"
          text = read(path)

          def cast_active_eta_assignments(text, function_name, expected):
              start = text.index(f"void {function_name}(")
              end = text.find("/*************************************************", start)
              block = text[start:end]
              active_end = block.find("#elif")
              if active_end == -1:
                  active_end = len(block)
              active = block[:active_end]
              tail = block[active_end:]
              pattern = re.compile(r"^(\s*t\[[0-7]\]\s*=\s*)([^;]*a->coeffs[^;]*);$", re.M)
              active, count = pattern.subn(lambda m: f"{m.group(1)}(uint8_t)({m.group(2)});", active)
              if count != expected:
                  raise RuntimeError(f"{function_name}: expected {expected} casts, got {count}")
              return text[:start] + active + tail + text[end:]

          text = cast_active_eta_assignments(text, "crypto_haetae_polyeta_pack", 4)
          text = cast_active_eta_assignments(text, "crypto_haetae_poly2eta_pack", 8)
          write(path, text)

          # Nonce construction is bounded by the declared maximum K/M parameters.
          path = "src/DigitalSignature/HAETAE/haetae_polyvec.c"
          text = read(path)
          include_marker = "#include \"haetae_polyvec.h\"\n"
          nonce_assert = (
              include_marker
              + "\n_Static_assert(((CRYPTO_HAETAE_MAX_K << 8) + CRYPTO_HAETAE_MAX_M +\n"
              + "                CRYPTO_HAETAE_MAX_K) <= UINT16_MAX,\n"
              + "               \"HAETAE expansion nonce must fit uint16_t\");\n"
          )
          text = replace_exact(text, include_marker, nonce_assert)
          old = (
              "\tconst int haetae_m = parameters->l - 1;\n"
              "\tunsigned int i, nonce = (parameters->k << 8) + haetae_m;\n"
          )
          new = (
              "\tconst uint32_t haetae_m = parameters->l - 1u;\n"
              "\tunsigned int i;\n"
              "\tuint16_t nonce = (uint16_t)((parameters->k << 8) + haetae_m);\n"
          )
          text = replace_exact(text, old, new)
          write(path, text)

          # The modular helpers consume values already held in uint32_t; widening their
          # parameter removes needless narrowing. sample_gauss returns a size_t count.
          path = "src/DigitalSignature/HAETAE/haetae_sampler.c"
          text = read(path)
          text = replace_exact(text, "static int mod3(uint8_t  t)", "static int mod3(uint32_t t)")
          text = replace_exact(text, "static int mod3_leq26(uint8_t  t)", "static int mod3_leq26(uint32_t t)")
          text = replace_exact(text, "static int mod3_leq8(uint8_t  t)", "static int mod3_leq8(uint32_t t)")
          text = replace_exact(
              text,
              "int crypto_haetae_sample_gauss(uint64_t *r, crypto_haetae_fp96_76 *sqsum, const uint8_t  *buf, const size_t buflen, const size_t len, const int dont_write_last)",
              "size_t crypto_haetae_sample_gauss(uint64_t *r, crypto_haetae_fp96_76 *sqsum, const uint8_t  *buf, const size_t buflen, const size_t len, const int dont_write_last)")
          write(path, text)

          # Guardrail: the three deferred sites must remain untouched by this change.
          deferred = {
              "src/DigitalSignature/HAETAE/haetae_fft.c": "return r >> 16;",
              "src/DigitalSignature/HAETAE/haetae_reduce.c": "return t;",
              "src/DigitalSignature/HAETAE/haetae_poly.c": "buf[i] = a->coeffs[i];",
          }
          for deferred_path, needle in deferred.items():
              if needle not in read(deferred_path):
                  raise RuntimeError(f"deferred review site changed unexpectedly: {deferred_path}")
      - name: Commit warning fixes
        shell: bash
        run: |
          rm .github/workflows/haetae-warning-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DigitalSignature/HAETAE .github/workflows/haetae-warning-fix.yml
          git commit -m "fix(haetae): make range-proven MSVC conversions explicit" \
            -m "Resolve the C4244/C4245/C4267 sites whose bounds or bit patterns are already proven. Keep three arithmetic/encoding conversions unchanged pending deeper review: _mulrnd16 in haetae_fft.c, crypto_haetae_freeze and nearby signed-shift arithmetic in haetae_reduce.c, and crypto_haetae_poly_decomposed_pack in haetae_poly.c."
          git push origin HEAD:fix/haetae-proven-msvc-warnings
