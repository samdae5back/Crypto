name: Apply LiberaCrypt public API rename

on:
  push:
    branches:
      - refactor/liberacrypt-public-api

permissions:
  contents: write

jobs:
  rename-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/liberacrypt-public-api
          fetch-depth: 0

      - name: Apply public API and package rename
        run: |
          python .github/liberacrypt_public_api_rename.py
          python .github/liberacrypt_public_api_post.py

      - name: Build and run focused tests
        run: |
          cmake -S . -B build \
            -DBUILD_SHARED_LIBS=ON \
            -DLIBERAC_BUILD_TESTS=ON
          cmake --build build --config Release -j2
          ctest --test-dir build -C Release \
            -R 'Public|Unit|HAETAE-120.KAT|ML-KEM-512.KAT' \
            --output-on-failure

      - name: Verify installed package identity
        run: |
          cmake --install build --prefix "$PWD/install" --config Release
          test -f install/bin/liberacrypt.dll
          test -f install/inc/LiberaCrypt.h
          test ! -e install/inc/Crypto.h
          test -f install/lib/cmake/LiberaCrypt/LiberaCryptConfig.cmake
          test -f install/lib/cmake/LiberaCrypt/LiberaCryptTargets.cmake
          grep -q '^LIBERAC_HASH$' cmake/liberacrypt_exports.txt
          if grep -q '^CRYPTO_HASH$' cmake/liberacrypt_exports.txt; then
            echo 'old CRYPTO_HASH export remains' >&2
            exit 1
          fi

      - name: Build installed-package consumer
        run: |
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.10)
          project(LiberaCryptConsumer C)
          find_package(LiberaCrypt CONFIG REQUIRED)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE LiberaCrypt::LiberaCrypt)
          EOF
          cat > consumer/main.c <<'EOF'
          #include <LiberaCrypt.h>
          #include <stdint.h>
          int main(void) {
              uint8_t digest[LIBERAC_SHA2_256_DIGEST_BYTES];
              const LiberaCError error = LIBERAC_HASH(
                  digest, sizeof(digest), NULL, 0u,
                  LIBERAC_ALG_HASH_SHA2_256);
              return error == LIBERAC_SUCCESS ? 0 : 1;
          }
          EOF
          cmake -S consumer -B consumer-build \
            -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build consumer-build --config Release -j2
          PATH="$PWD/install/bin:$PATH" ./consumer-build/Release/consumer.exe

      - name: Commit rename
        run: |
          rm .github/liberacrypt_public_api_rename.py
          rm .github/liberacrypt_public_api_post.py
          rm .github/workflows/liberacrypt-public-api-rename.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(api): rename public surface to LiberaCrypt" \
            -m "Rename public functions, macros, and algorithm selectors to LIBERAC_; public types to LiberaC*; the umbrella header to LiberaCrypt.h; the CMake package and target to LiberaCrypt::LiberaCrypt; and the library output to liberacrypt. Keep unrelated vendored and private implementation namespaces intact. Validate the installed package with a standalone consumer and representative tests."
          git push origin HEAD:refactor/liberacrypt-public-api
