name: ML-KEM Three-Way Reduction Benchmark

on:
  push:
    branches:
      - feature/mlkem-full-montgomery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve benchmark harness and refs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mlkem-bench-project"
          cp benchmarks/ML-KEM.c "$RUNNER_TEMP/mlkem-bench-project/ML-KEM.c"
          cat > "$RUNNER_TEMP/mlkem-bench-project/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.15)
          project(MLKEMReductionBenchmark C)
          if(NOT DEFINED LIBERAC_SOURCE_ROOT)
            message(FATAL_ERROR "LIBERAC_SOURCE_ROOT is required")
          endif()
          find_package(LiberaCrypt CONFIG REQUIRED)
          add_executable(mlkem-benchmark ML-KEM.c)
          target_include_directories(mlkem-benchmark PRIVATE
            "${LIBERAC_SOURCE_ROOT}/inc"
            "${LIBERAC_SOURCE_ROOT}/src"
            "${LIBERAC_SOURCE_ROOT}/src/KeyEncapsulation/ML-KEM")
          target_link_libraries(mlkem-benchmark PRIVATE LiberaCrypt::LiberaCrypt)
          if(MSVC)
            target_compile_options(mlkem-benchmark PRIVATE /O2)
          else()
            target_compile_options(mlkem-benchmark PRIVATE -O3)
          endif()
          CMAKE
          echo "FULL_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "BARRETT_SHA=e931f90debf742df4c3f16b4b7a0c7c955943bd5" >> "$GITHUB_ENV"
          echo "HYBRID_SHA=c5e0ff5e6371b4c7a2553d0c3e2c08292b9f8faf" >> "$GITHUB_ENV"

      - name: Build all three implementations
        shell: bash
        run: |
          set -euo pipefail

          build_variant() {
            label="$1"
            sha="$2"
            build_dir="$RUNNER_TEMP/lib-build-$label"
            install_dir="$RUNNER_TEMP/lib-install-$label"
            bench_dir="$RUNNER_TEMP/bench-build-$label"

            git checkout --force "$sha"
            rm -rf "$build_dir" "$install_dir" "$bench_dir"
            cmake -S . -B "$build_dir" \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DLIBERAC_BUILD_TESTS=OFF \
              -DCMAKE_INSTALL_PREFIX="$install_dir"
            cmake --build "$build_dir" --config Release --parallel 2
            cmake --install "$build_dir" --config Release

            cmake -S "$RUNNER_TEMP/mlkem-bench-project" -B "$bench_dir" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$install_dir" \
              -DLIBERAC_SOURCE_ROOT="$GITHUB_WORKSPACE"
            cmake --build "$bench_dir" --config Release --parallel 2

            exe="$(find "$bench_dir" -type f \( -name 'mlkem-benchmark' -o -name 'mlkem-benchmark.exe' \) -print -quit)"
            test -n "$exe"
            cp "$exe" "$RUNNER_TEMP/mlkem-benchmark-$label${exe##*mlkem-benchmark}"
            echo "$exe" > "$RUNNER_TEMP/exe-$label.txt"
          }

          build_variant barrett "$BARRETT_SHA"
          build_variant hybrid "$HYBRID_SHA"
          build_variant full "$FULL_SHA"

      - name: Run interleaved benchmark rounds
        shell: bash
        run: |
          set -euo pipefail

          run_variant() {
            label="$1"
            round="$2"
            exe="$(cat "$RUNNER_TEMP/exe-$label.txt")"
            "$exe" > "$RUNNER_TEMP/$label-r$round.csv"
          }

          # Rotate the execution order to reduce simple thermal/frequency bias.
          run_variant barrett 1
          run_variant hybrid 1
          run_variant full 1

          run_variant full 2
          run_variant hybrid 2
          run_variant barrett 2

          run_variant hybrid 3
          run_variant barrett 3
          run_variant full 3

      - name: Aggregate and compare
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import os
          import statistics
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          labels = ('barrett', 'hybrid', 'full')

          def read_one(path):
              with path.open(newline='') as f:
                  return {
                      (row['algorithm'], row['operation']): int(row['median_ns'])
                      for row in csv.DictReader(f)
                  }

          values = {label: {} for label in labels}
          keys = None
          for label in labels:
              rounds = [read_one(root / f'{label}-r{i}.csv') for i in (1, 2, 3)]
              if keys is None:
                  keys = list(rounds[0].keys())
              for key in keys:
                  values[label][key] = int(statistics.median(r[key] for r in rounds))

          def gain(before, after):
              return (before - after) * 100.0 / before

          out = root / 'three-way-comparison.csv'
          with out.open('w', newline='') as f:
              writer = csv.writer(f)
              writer.writerow([
                  'algorithm', 'operation', 'barrett_ns', 'hybrid_ns', 'full_ns',
                  'hybrid_vs_barrett_percent', 'full_vs_barrett_percent',
                  'full_vs_hybrid_percent'
              ])
              for key in keys:
                  b = values['barrett'][key]
                  h = values['hybrid'][key]
                  m = values['full'][key]
                  writer.writerow([
                      key[0], key[1], b, h, m,
                      f'{gain(b, h):.3f}', f'{gain(b, m):.3f}',
                      f'{gain(h, m):.3f}'
                  ])

          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a') as f:
              f.write(f'## ML-KEM three-way benchmark — {os.environ.get("RUNNER_OS", "unknown")}\n\n')
              f.write('Each implementation was built separately on this runner. '
                      'Each binary was executed three times in rotated order; the '
                      'table uses the median of the three per-binary medians. '
                      'Positive percentages mean the implementation on the right is faster.\n\n')
              f.write('| Parameter | Op | Barrett (ns) | Hybrid (ns) | Full (ns) | '
                      'Hybrid vs B | Full vs B | Full vs H |\n')
              f.write('| --- | --- | ---: | ---: | ---: | ---: | ---: | ---: |\n')
              for key in keys:
                  b = values['barrett'][key]
                  h = values['hybrid'][key]
                  m = values['full'][key]
                  f.write(f'| {key[0]} | {key[1]} | {b:,} | {h:,} | {m:,} | '
                          f'{gain(b,h):+.2f}% | {gain(b,m):+.2f}% | '
                          f'{gain(h,m):+.2f}% |\n')
          PY
          cat "$RUNNER_TEMP/three-way-comparison.csv"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: mlkem-three-way-${{ runner.os }}
          path: |
            ${{ runner.temp }}/barrett-r*.csv
            ${{ runner.temp }}/hybrid-r*.csv
            ${{ runner.temp }}/full-r*.csv
            ${{ runner.temp }}/three-way-comparison.csv
