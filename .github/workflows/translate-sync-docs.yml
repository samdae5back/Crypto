name: Translate & Sync Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**/*.md'
      - '!docs/i18n/**'
  workflow_dispatch:
    inputs:
      language:
        description: Translation language
        required: true
        default: all
        type: choice
        options:
          - all
          - ko
          - ja
      scope:
        description: Documents to translate
        required: true
        default: changed
        type: choice
        options:
          - changed
          - all
      model:
        description: OpenAI model
        required: true
        default: gpt-5.6-sol
        type: choice
        options:
          - gpt-5.6-sol
          - gpt-5.6-terra
          - gpt-5.6-luna

permissions:
  contents: write

concurrency:
  group: liberacrypt-translate-sync
  cancel-in-progress: false

jobs:
  translate-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require main branch
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Translate & Sync Docs must be run from the main branch." >&2
            exit 1
          fi

      - name: Validate translation tooling
        run: |
          python3 -m py_compile tools/translate_docs.py tools/prune_translations.py tools/build_wiki.py

      - name: Check OpenAI API key
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured in repository Actions secrets." >&2
            exit 1
          fi

      - name: Remove orphaned translations
        run: python3 tools/prune_translations.py

      - name: Translate documentation
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRANSLATE_LANGUAGE: ${{ inputs.language || 'all' }}
          TRANSLATE_SCOPE: ${{ inputs.scope || 'changed' }}
          TRANSLATE_MODEL: ${{ inputs.model || 'gpt-5.6-sol' }}
        run: |
          python3 tools/translate_docs.py \
            --language "$TRANSLATE_LANGUAGE" \
            --scope "$TRANSLATE_SCOPE" \
            --model "$TRANSLATE_MODEL"

      - name: Commit translation updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/i18n

          if git diff --cached --quiet; then
            echo "Translations are already up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "docs: update generated translations"
            git push origin HEAD:main
            echo "Updated generated Korean/Japanese translations." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build wiki pages
        run: python3 tools/build_wiki.py --output wiki-build

      - name: Check whether the wiki repository is initialized
        id: wiki
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if git ls-remote "$remote" >/dev/null 2>&1; then
            echo "initialized=true" >> "$GITHUB_OUTPUT"
          else
            echo "initialized=false" >> "$GITHUB_OUTPUT"
            echo "The GitHub Wiki has not been initialized yet." >> "$GITHUB_STEP_SUMMARY"
            echo "Create one Wiki page once, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish generated pages
        if: steps.wiki.outputs.initialized == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          git clone "$remote" wiki
          rsync -a --delete --exclude='.git/' wiki-build/ wiki/

          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki is already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sync_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse --short=12 HEAD)"
          git commit -m "Sync documentation from ${sync_sha}"
          git push origin HEAD
          echo "Wiki synchronized from ${sync_sha}." >> "$GITHUB_STEP_SUMMARY"
